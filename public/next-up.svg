<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Y-axis (vertical line) -->
  <line x1="80" y1="70" x2="80" y2="420" stroke="black" stroke-width="30" stroke-linecap="round"/>

  <!-- Y-axis arrow -->
  <path d="M 80 70 L 50 110 M 80 70 L 110 110" stroke="black" stroke-width="30" stroke-linecap="round"/>

  <!-- X-axis (horizontal line) -->
  <line x1="80" y1="420" x2="460" y2="420" stroke="black" stroke-width="30" stroke-linecap="round"/>

  <!-- X-axis arrow -->
  <path d="M 460 420 L 420 390 M 460 420 L 420 450" stroke="black" stroke-width="30" stroke-linecap="round"/>

  <!-- Curved growth arrow (orange) -->
  <path d="M 140 380 Q 200 320, 280 240 Q 340 180, 400 120" stroke="#F59E0B" stroke-width="35" stroke-linecap="round" fill="none"/>

  <!-- Arrow head for growth curve -->
  <path d="M 400 120 L 360 140 L 380 180 Z" fill="#F59E0B" stroke="black" stroke-width="12" stroke-linejoin="round"/>

  <!-- Mathematical notation "a²" -->
  <text x="200" y="200" font-family="serif" font-size="80" font-weight="bold" fill="black">a</text>
  <text x="245" y="160" font-family="serif" font-size="50" font-weight="bold" fill="black">2</text>
</svg>
